# ==============================================================================
# Baseline Models Configuration for Credit Scoring Benchmark
# ==============================================================================

experiment:
  name: "baseline_benchmark"
  description: "Benchmarking 6 candidate algorithms on 5-fold CV to position XGBoost"
  random_state: 42
  metrics:
    primary: "roc_auc"
    supplementary:
      - "pr_auc"
      - "f1"
      - "precision"
      - "recall"
      - "balanced_accuracy"
      - "brier_score"

models:
  logistic_regression:
    enabled: true
    requires_scaling: true
    params:
      C: 1.0
      penalty: "l2"
      solver: "lbfgs"
      max_iter: 1000
      random_state: 42

  random_forest:
    enabled: true
    requires_scaling: false
    params:
      n_estimators: 200
      max_depth: 10
      min_samples_split: 5
      min_samples_leaf: 2
      random_state: 42
      n_jobs: -1

  gradient_boosting:
    enabled: true
    requires_scaling: false
    params:
      n_estimators: 150
      learning_rate: 0.1
      max_depth: 4
      subsample: 0.8
      random_state: 42

  lightgbm:
    enabled: true
    requires_scaling: false
    params:
      n_estimators: 200
      learning_rate: 0.05
      num_leaves: 31
      max_depth: -1
      random_state: 42
      verbose: -1
      n_jobs: -1

  catboost:
    enabled: true
    requires_scaling: false
    params:
      iterations: 300
      learning_rate: 0.05
      depth: 6
      random_seed: 42
      verbose: 0
      thread_count: -1

  xgboost_default:
    enabled: true
    requires_scaling: false
    params:
      n_estimators: 200
      learning_rate: 0.1
      max_depth: 6
      subsample: 1.0
      colsample_bytree: 1.0
      random_state: 42
      eval_metric: "logloss"
      n_jobs: -1
